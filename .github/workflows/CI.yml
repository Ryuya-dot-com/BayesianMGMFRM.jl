name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  # Ordinary jobs are distribution checks, not consumers of optional study results.
  BAYESIANMGMFRM_RESEARCH_EVIDENCE_TESTS: "false"

jobs:
  postprocessing:
    name: Postprocessing without fits - Julia ${{ matrix.julia }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10.8', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Check summaries, figure data, contrasts and cache reload
        run: julia --startup-file=no --project=. test/postprocessing.jl
      - name: Check Gaussian conditional coordinates and deterministic integration
        run: julia --startup-file=no --project=. test/mgmfrm_core_location_section.jl
      - name: Check MGMFRM estimands and identification counterexamples without fits
        run: julia --startup-file=no --project=. test/mgmfrm_estimand_invariance.jl
      - name: Check MGMFRM prior measures, moments, empty steps and score reflection without fits
        run: julia --startup-file=no --project=. test/mgmfrm_prior_measure.jl
      - name: Check normalized MGMFRM prior generation and saved explanations without fits
        run: julia --startup-file=no --project=. test/mgmfrm_normalized_prior_predictive.jl
      - name: Check normalized location density and gradients without sampling
        run: julia --startup-file=no --project=. test/mgmfrm_normalized_location.jl
      - name: Check independent one-transition probe mechanics
        run: julia --startup-file=no --project=. test/mgmfrm_core_nuts_stationarity.jl
      - name: Check coupled gradients and nonlinear coordinate curvature
        run: julia --startup-file=no --project=. test/mgmfrm_core_coupled_geometry.jl
      - name: Check saved adaptation review without sampling
        run: julia --startup-file=no --project=. test/mgmfrm_adaptation_review.jl

  mgmfrm-core-python:
    name: MGMFRM numerical and execution checks - no fits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install numerical check dependencies
        run: python -m pip install -r test/requirements-mgmfrm-core.txt
      - name: Check arithmetic, failure accounting and lossless storage
        run: |
          # Standalone entry points avoid test/script module-name collisions.
          for check in coverage_review classifier_review rank_review item_conditional \
            sbc_review sbc_error_budget sbc_plan sbc_decision sbc_runner sbc_cohort; do
            python "test/mgmfrm_core_${check}.py" -v || exit 1
          done
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Load the saved SBC worker and reject incomplete snapshots without fits
        run: python test/mgmfrm_core_sbc_runtime.py

  minimum-version-test:
    name: Full package tests - Julia 1.10.8 - Ubuntu
    runs-on: ubuntu-latest
    env:
      BAYESIANMGMFRM_TEST_GROUP: all
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.8'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  current-version-test:
    name: Current Julia - ${{ matrix.label }} - Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            label: Core and design
          - group: fitting_core
            label: MFRM fit integration
          - group: fitting_reports
            label: Reports and hard anchors
          - group: local_dependence_core
            label: Local-dependence diagnostics and calibration
          - group: local_dependence_integrity
            label: Local-dependence provenance and resource guards
          - group: generalized
            label: Generalized models
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run ${{ matrix.label }} test shard
        shell: bash
        env:
          BAYESIANMGMFRM_TEST_GROUP: ${{ matrix.group }}
        run: |
          timer=()
          if [[ "$BAYESIANMGMFRM_TEST_GROUP" == fitting_core ]]; then
            lscpu
            free --mebi
            timer=(/usr/bin/time -v)
          fi
          "${timer[@]}" julia --startup-file=no --project=. -e 'using Pkg; Pkg.test()'

  platform-smoke:
    name: Platform smoke - Julia 1 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check local POSIX measurement guard
        if: runner.os == 'macOS'
        run: python3 scripts/measure_command.py --self-test
      - name: Use a short Windows temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'D:\t' | Out-Null
          "TMP=D:\t" >> $env:GITHUB_ENV
          "TEMP=D:\t" >> $env:GITHUB_ENV
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run portable package smoke
        run: julia --startup-file=no --project=. scripts/platform_smoke.jl

  research-evidence:
    name: Research evidence and SHA lineage
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      BAYESIANMGMFRM_RESEARCH_EVIDENCE_TESTS: "true"
      BAYESIANMGMFRM_TEST_GROUP: all
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run opt-in research-evidence fixtures
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.test()'

  research-harness-portability:
    name: Research harness portability
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.8'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Regenerate the tracked research harness
        shell: pwsh
        run: |
          $GeneratedHarness = Join-Path $env:RUNNER_TEMP 'local_dependence_pilot_batch_execution_harness.json'
          julia --startup-file=no --project=. scripts/generate_local_dependence_pilot_batch_execution_harness.jl --output $GeneratedHarness
          git diff --no-index --exit-code -- test/fixtures/local_dependence_pilot_batch_execution_harness.json $GeneratedHarness

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Build documentation
        run: |
          julia --startup-file=no --project=docs docs/build.jl
          julia --startup-file=no scripts/public_language_gate.jl --rendered

  experimental-boundary:
    name: Experimental namespace boundary and lightweight guarded-fit smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.8'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Test the experimental 2D free-correlation contract and bounded diagnostic smoke
        env:
          BAYESIANMGMFRM_FREE_CORRELATION_SMOKE: "true"
          BAYESIANMGMFRM_FREE_CORRELATION_RECOVERY_SMOKE: "true"
          JULIA_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: julia --startup-file=no --project=. test/mgmfrm_free_latent_correlation_2d.jl
      - name: Test the experimental boundary and guarded fits
        env:
          BAYESIANMGMFRM_EXPERIMENTAL_BOUNDARY_SMOKE: "true"
        run: julia --startup-file=no --project=. test/experimental_namespace.jl

  release-hygiene-gate:
    name: Release hygiene gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local POSIX measurement guard
        run: python3 scripts/measure_command.py --self-test
      - name: Check compressed source archive budget
        shell: bash
        run: |
          # 2026-10-02: normalized MGMFRM source/tests/docs bring the reviewed
          # candidate to 4.32 MiB; results and caches remain excluded.
          source_archive_bytes=$(git archive --format=tar.gz HEAD | wc -c)
          printf 'Compressed source archive: %s bytes (limit 5242880)\n' "$source_archive_bytes"
          test "$source_archive_bytes" -le 5242880
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Verify the clean distribution candidate
        run: julia --startup-file=no scripts/distribution_archive_smoke.jl
      - name: Run release hygiene gate
        run: |
          julia --startup-file=no scripts/pre_registration_gate.jl --skip-tests --skip-docs --expected-version=0.1.2
